packages:
  - "frontend"
  - "backend"
allowBuilds:
  # protobufjs is a transitive dep of genkit's OpenTelemetry plumbing, not
  # something our code calls directly — its postinstall/build step isn't
  # needed for the published package to work as a dependency, so left
  # disallowed rather than running untrusted install scripts on trust alone.
  esbuild: true
  protobufjs: false
ignoredOptionalDependencies:
  # An optional dependency of @genkit-ai/core that pulls in firebase-admin,
  # googleapis and Google Cloud telemetry exporters (~430MB of the backend's
  # ~610MB production node_modules). The backend uses neither Firebase nor
  # Cloud telemetry, and Genkit only loads it when present, so skipping it
  # keeps the Cloud Run image (and every cold start) much smaller. Verified by
  # running the server from the resulting production tree (TASK-13).
  - "@genkit-ai/firebase"
overrides:
  # Pins @dotenvx/dotenvx's transitive systeminformation dependency to a
  # release old enough to clear pnpm's minimumReleaseAge supply-chain
  # policy — 5.33.13 was published hours before a CI run and got rejected.
  systeminformation: 5.33.12
