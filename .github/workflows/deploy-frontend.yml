name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # The build env below is part of the frontend build, so changing it
      # should redeploy too.
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vite inlines these at build time. They live here rather than in
      # frontend/.env.production so only the deployed site talks to the real
      # Backend; local builds and CI tests stay on the stub.
      - run: pnpm --filter frontend run build
        env:
          VITE_CHAT_ADAPTER: live
          VITE_BACKEND_URL: https://pun-agent-backend-203365930808.us-east1.run.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          entryPoint: frontend
          channelId: live
