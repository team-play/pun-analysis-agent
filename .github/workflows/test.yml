name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-js:
    name: JS (${{ matrix.package }})
    strategy:
      matrix:
        include:
          # The frontend build (tsc -b && vite build) only runs at deploy time
          # otherwise, so build it here to catch type and build errors in the
          # PR. VITE_CHAT_ADAPTER is unset, so this builds the stub.
          - package: frontend
            build: true
            typecheck: false
          # deploy-backend.yml's image build already compiles the backend on
          # every pull request that touches it, but that build only covers
          # src/. typecheck also covers tests/ and scripts/, which Node runs
          # without checking their types.
          - package: backend
            build: false
            typecheck: true
          - package: "@pun-agent/timeouts"
            build: false
            typecheck: false
    uses: ./.github/workflows/test-js.yml
    with:
      package: ${{ matrix.package }}
      build: ${{ matrix.build }}
      typecheck: ${{ matrix.typecheck }}

  # VITE_APP_CHECK=off (TASK-73) must only ever work under `pnpm dev`. Build
  # the worst case, a live bundle with the switch set, and fail if the skip's
  # warning made it in: that means its import.meta.env.DEV gate stopped
  # removing it (see frontend/src/lib/chat/get-chat-model-adapter.ts).
  app-check-skip-not-shipped:
    name: Frontend bundle has no App Check skip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter frontend
      - run: |
          pnpm --filter frontend exec vite build
          # The Backend URL is only inlined by the live adapter, so this proves
          # the grep below reads a live bundle (and that frontend/dist exists).
          grep -rqF "$VITE_BACKEND_URL" frontend/dist
          if grep -rlF "VITE_APP_CHECK=off" frontend/dist; then
            echo "::error::The App Check skip is in the production bundle."
            exit 1
          fi
        env:
          VITE_CHAT_ADAPTER: live
          VITE_BACKEND_URL: http://localhost:8080
          VITE_APP_CHECK: "off"

  test-python:
    uses: ./.github/workflows/test-python.yml

  test-eval:
    name: Unittest (eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - working-directory: eval
        run: uv sync --locked
      - working-directory: eval
        run: uv run python -m unittest discover -s tests
