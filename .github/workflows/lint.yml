name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-js:
    name: Biome + Mermaid (backend, frontend, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:mermaid

  lint-python:
    name: Ruff (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [inference, eval]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: ${{ matrix.package }}
        run: uv sync --locked
      - working-directory: ${{ matrix.package }}
        run: uv run ruff check .
